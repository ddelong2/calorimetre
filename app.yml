version: 2

name: CALORIMETRE
database: APPS
schema: PUBLIC
query_warehouse: SNOWADHOC

label: "Calorimètre"
description: "Photographiez votre repas : Cortex AI identifie les aliments et estime les calories."
icon: public/icon.svg

ignore:
  - node_modules
  - .env*
  - __pycache__
  - "*.pyc"
  - .next
  - .git
  - snowflake.log
  - output

install:
  commands:
    - ["npm", "ci", "--include=dev"]

build:
  commands:
    - ["npm", "run", "build"]
    # For standalone mode
    - ["cp", "-r", ".next/static", ".next/standalone/.next/static"]
    - ["cp", "-r", "public", ".next/standalone/public"]
    # Avoid packaging extra node_modules since standalone includes its own
    - ["rm", "-rf", "node_modules"]

run:
  command: ["node", ".next/standalone/server.js"]

# Account-specific settings read by lib/config.ts. Keep in sync with sql/setup.sql.
environment_variables:
  - name: CALO_DATABASE
    value: "TEMP"
  - name: CALO_SCHEMA
    value: "DDELONG"
  - name: CALO_STAGE
    value: "FOOD_IMAGES"
  - name: CALO_MODEL
    value: "claude-sonnet-4-6"
